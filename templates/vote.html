<!-- templates/vote.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cast Vote | Voting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">🗳 Cast Your Vote</h2>

    <form method="post" action="{{ url_for('vote') }}">
        <input type="hidden" name="voter_id" value="{{ voter_id }}">

        <div class="row">
            {% for candidate in candidates %}
            <div class="col-md-4 mb-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ candidate.name }}</h5>
                        <button type="submit" name="candidate_id" value="{{ candidate.id }}" class="btn btn-success mt-3">Vote</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </form>
</div>

</body>
</html>
